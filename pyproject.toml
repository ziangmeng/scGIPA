[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "scgipa"
version = "0.3.0"
description = "Single-cell Genetically Informed Perturbation Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<2", "pandas>=2.0,<3", "torch>=2.1,<3"]

[project.urls]
Repository = "https://github.com/ziangmeng/scGIPA"
Issues = "https://github.com/ziangmeng/scGIPA/issues"

[tool.setuptools.packages.find]
include = ["scgipa*", "grs_vae*"]
